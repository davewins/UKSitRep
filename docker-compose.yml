services:
  uksitrep:
    image: ghcr.io/davewins/uksitrep:latest   # or: build: .
    container_name: uksitrep
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"   # set HOST_PORT to publish on another port
    # Values come from a .env file next to this file (docker compose) or from
    # the stack's "Environment variables" section (Portainer). Unset = default.
    environment:
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      NATIONAL_HIGHWAYS_KEY: ${NATIONAL_HIGHWAYS_KEY:-}
      NATIONAL_HIGHWAYS_KEY_SECONDARY: ${NATIONAL_HIGHWAYS_KEY_SECONDARY:-}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      FUEL_FINDER_CLIENT_ID: ${FUEL_FINDER_CLIENT_ID:-}
      FUEL_FINDER_CLIENT_SECRET: ${FUEL_FINDER_CLIENT_SECRET:-}
      ENABLE_LIGHTNING: ${ENABLE_LIGHTNING:-true}
      RAIL_LDB_KEY: ${RAIL_LDB_KEY:-}
      RAIL_DISRUPTIONS_KEY: ${RAIL_DISRUPTIONS_KEY:-}
      RAIL_STATIONS: ${RAIL_STATIONS:-}
      HOME_LAT: ${HOME_LAT:-}
      HOME_LON: ${HOME_LON:-}
      HOME_NAME: ${HOME_NAME:-Home}
      HOME_RADIUS_KM: ${HOME_RADIUS_KM:-25}
      HA_WEBHOOK_URL: ${HA_WEBHOOK_URL:-}
      NOTIFY: ${NOTIFY:-warning,flood,river,sewage,fire,road,power,rnli,aircraft,hems,lightning,iss,rail}
      BBC_LOCAL_REGIONS: ${BBC_LOCAL_REGIONS:-}
      ENABLE_BACKGROUND_ADSB: ${ENABLE_BACKGROUND_ADSB:-true}
      ENABLE_WORLDCAM: ${ENABLE_WORLDCAM:-false}
      ENABLE_DSFRS: ${ENABLE_DSFRS:-false}
      FIRE_SERVICES: ${FIRE_SERVICES:-avon,bucks,cheshire,cleveland,hants,rbfrs,shropshire}
      DSFRS_STATION_IDS: ${DSFRS_STATION_IDS:-}
      DSFRS_AREAS: ${DSFRS_AREAS:-Teignbridge,Torbay}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - uksitrep-data:/data
      # - ./config/cameras.json:/config/cameras.json:ro   # then set CAMERAS_FILE=/config/cameras.json
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  uksitrep-data:
