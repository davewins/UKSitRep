<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f14">
<title>UK SitRep</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="icons/site.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0b0f14; --panel: rgba(13,18,25,.92); --line: #1f2a37; --text: #d6dde6; --muted: #7d8a99;
    --civil: #8aa4c8; --military: #4ade80; --police: #3b82f6; --hems: #facc15; --sar: #fb923c;
    --emerg: #ef4444; --rnli: #f97316; --gov: #a78bfa; --red: #ef4444; --amber: #f59e0b; --yellow: #facc15;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 40px 0 30px 0; background: var(--bg); }
  .leaflet-container { background: var(--bg); }
  /* top bar */
  #top { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center;
    gap: 12px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 1000; }
  #top h1 { font-size: 15px; margin: 0; letter-spacing: .08em; white-space: nowrap; }
  #clock { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  #chips { display: flex; gap: 6px; overflow: hidden; flex: 1; min-width: 0; }
  #chips .chip.sum { cursor: pointer; background: #1e293b; color: var(--fg, #e2e8f0); }
  .chip.off::before { content: "●"; color: #64748b; margin-right: 4px; }
  #feedList { position: absolute; top: 40px; left: 12px; z-index: 2000; background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    padding: 8px 10px; max-height: 70vh; overflow: auto; display: none; box-shadow: 0 6px 20px #000a; min-width: 300px; font-size: 12px; }
  #feedList.open { display: block; }
  #feedList .row { display: flex; gap: 10px; justify-content: space-between; padding: 2px 0; }
  #feedList .row .muted { text-align: right; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { padding: 2px 7px; border-radius: 10px; background: #18212c; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .chip.ok::before { content: "●"; color: var(--ok); margin-right: 4px; }
  .chip.err::before { content: "●"; color: var(--red); margin-right: 4px; }
  .chip.stale::before { content: "●"; color: var(--amber); margin-right: 4px; }
  #top button { background: #18212c; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 9px; cursor: pointer; font: inherit; }
  /* place search */
  #searchBox { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: min(380px, calc(100vw - 32px));
    z-index: 2000; background: #0f172a; border: 1px solid #334155; border-radius: 8px; box-shadow: 0 6px 20px #000a; padding: 6px; display: none; }
  #searchBox.open { display: block; }
  #searchBox .sbar { display: flex; gap: 6px; }
  #searchQ { flex: 1; min-width: 0; background: #111a24; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; font-size: 14px; }
  #searchBox button { background: #18212c; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  #searchRes .r { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  #searchRes .r:hover, #searchRes .r.sel { background: #1e293b; }
  #searchRes .r .muted { font-size: 11px; text-align: right; }
  #searchRes .msg { padding: 6px 8px; color: var(--muted); font-size: 12px; }
  #searchArea { width: 100%; margin-top: 6px; background: #111a24; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px; font: inherit; font-size: 13px; }
  .area-lbl { font-weight: 600; }
  .found-pin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #f43f5e; box-shadow: 0 0 0 4px #f43f5e55; animation: foundPulse 1.6s ease-out infinite; }
  .me-dot { width: 16px; height: 16px; border-radius: 50%; background: #3b82f6; border: 3px solid #fff; box-shadow: 0 0 0 0 #3b82f6aa; animation: mePulse 2s ease-out infinite; }
  @keyframes mePulse { 0% { box-shadow: 0 0 0 0 #3b82f6aa; } 100% { box-shadow: 0 0 0 16px #3b82f600; } }
  #btnLocate.busy { animation: locBlink .8s ease-in-out infinite alternate; }
  @keyframes locBlink { to { opacity: .35; } }
  #toast { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 2100; max-width: min(420px, calc(100vw - 32px));
    background: #0f172a; color: var(--text); border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; font-size: 13px; box-shadow: 0 6px 20px #000a; display: none; }
  #toast.show { display: block; }
  @keyframes foundPulse { 0% { box-shadow: 0 0 0 0 #f43f5eaa; } 100% { box-shadow: 0 0 0 18px #f43f5e00; } }
  /* side panels */
  .panel { position: absolute; top: 48px; bottom: 38px; width: 270px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; z-index: 900; overflow-y: auto; padding: 8px 10px; }
  #left { left: 8px; } #right { right: 8px; width: 310px; }
  body.kiosk #left { display: none; }
  body.hide-panels .panel { display: none; }
  .panel h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    margin: 12px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .panel h2:first-child { margin-top: 2px; }
  #nearTitle select { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 0 2px; }
  label.t { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
  label.t .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  #left h2 label.grp { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .bulk { display: flex; gap: 6px; margin: 4px 0 2px; }
  .bulk button { flex: 1; background: #1e293b; color: inherit; border: 1px solid #334155; border-radius: 4px; padding: 3px 0; cursor: pointer; font: inherit; font-size: 12px; }
  .sublayers { margin-left: 18px; border-left: 1px solid var(--line, #334155); padding-left: 8px; }
  .sublayers.off { opacity: .4; }
  .sublayers label.t { font-size: 12px; padding: 1px 0; }
  label.t .n { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  select { background: #18212c; color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .muted { color: var(--muted); }
  .alert { border-left: 3px solid var(--red); padding: 4px 7px; margin: 4px 0; background: rgba(239,68,68,.08); cursor: pointer; }
  .alert.amber { border-color: var(--amber); background: rgba(245,158,11,.08); }
  .alert.yellow { border-color: var(--yellow); background: rgba(250,204,21,.06); }
  .alert.info { border-color: var(--police); background: rgba(59,130,246,.07); }
  .alert small { color: var(--muted); display: block; }
  .bar { height: 8px; border-radius: 2px; background: #1b2633; overflow: hidden; }
  .bar > i { display: block; height: 100%; }
  .news { padding: 4px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .news .sev { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  /* ticker */
  #ticker { position: absolute; bottom: 0; left: 0; right: 0; height: 30px; background: var(--panel);
    border-top: 1px solid var(--line); overflow: hidden; z-index: 1000; display: flex; align-items: center; }
  #ticker .lbl { background: #b91c1c; color: #fff; font-weight: 700; padding: 0 10px; height: 100%;
    display: flex; align-items: center; letter-spacing: .08em; flex: none; z-index: 1; }
  #ticker .track { white-space: nowrap; animation: scroll linear infinite; padding-left: 100%; }
  #ticker .track a { margin-right: 48px; color: var(--text); text-decoration: none; }
  #ticker .track a:hover { color: #fff; text-decoration: underline; }
  #ticker:hover .track, #ticker:active .track { animation-play-state: paused; }
  .news a { color: var(--text); text-decoration: none; }
  .news a:hover { color: #fff; text-decoration: underline; }
  .news .pin { cursor: pointer; color: #7dd3fc; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  /* map icons */
  .ac, .vs { background: none; border: none; }
  .ac svg, .vs svg { overflow: visible; }
  .pulse svg { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .leaflet-tooltip.lbl { background: rgba(10,14,20,.75); color: var(--text); border: none; box-shadow: none;
    padding: 0 4px; font-size: 10.5px; line-height: 1.3; border-radius: 3px; }
  .leaflet-tooltip.lbl::before { display: none; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #111821; color: var(--text); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 12.5px; }
  .leaflet-popup-content b { color: #fff; }
  .leaflet-popup-content a { color: #7dd3fc; }
  .wx { background: none; border: none; color: #cbd5e1; font-size: 11px; white-space: nowrap; text-shadow: 0 0 3px #000; }
  .base { background: none; border: none; }
  .fuel-card { background: #0f172a; color: #e2e8f0; border: 2px solid; border-radius: 5px; padding: 1px 3px 2px; font: 600 10px/12px system-ui; box-shadow: 0 1px 3px #0008; }
  .fuel-head { display: flex; align-items: center; gap: 3px; white-space: nowrap; overflow: hidden; font-size: 9.5px; color: #fff; margin-bottom: 1px; }
  .fuel-head span { overflow: hidden; text-overflow: ellipsis; }
  .fuel-p { display: flex; justify-content: space-between; }
  .fuel-p span { color: #94a3b8; font-weight: 500; }
  .tide-tbl { border-collapse: collapse; width: 100%; font-size: 12px; margin-bottom: 4px; }
  .tide-tbl td { padding: 1px 6px 1px 0; }
  .bus { position: relative; width: 26px; height: 26px; }
  .bus .dir { position: absolute; inset: 0; }
  .bus .dir::before { content: ""; position: absolute; left: 50%; top: -2px; margin-left: -4px; border: 4px solid transparent; border-top: 0; border-bottom: 6px solid #f59e0b; }
  .bus .no { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #f59e0b; color: #111; font: 700 10px/1 system-ui, sans-serif;
    padding: 3px 4px; border-radius: 4px; border: 1px solid #000; white-space: nowrap; min-width: 12px; text-align: center; }
  .bus.old { opacity: .5; }
  .rail-tbl { border-collapse: collapse; width: 100%; font-size: 12px; margin: 4px 0; }
  .rail-tbl td { padding: 2px 6px 2px 0; vertical-align: top; }
  .rail-tbl td.t { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rail-tbl .ok { color: #4ade80; } .rail-tbl .late { color: #fbbf24; } .rail-tbl .cx { color: #f87171; font-weight: 700; }
  .rail-tbl small { display: block; color: var(--muted); font-size: 10.5px; }
  .cam-pop img { display: block; width: 280px; max-width: 70vw; border-radius: 4px; margin: 6px 0; background: #000; min-height: 60px; }
  .sea { background: none; border: none; text-align: center; }
  .wind, .tmp { background: none; border: none; }
  .tmp { font-size: 11px; font-weight: 700; text-shadow: 0 0 3px #000, 0 0 3px #000; text-align: center; }
  .radar-ctl { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px;
    display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 11px; }
  .radar-ctl button { background: #18212c; color: var(--text); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; padding: 2px 7px; }
  .sea .lbl2 { font-size: 10px; color: #e2e8f0; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; line-height: 1.1; }
  #btnLayers, #btnInfo, .sheet-close { display: none; }
  @media (min-width: 761px) { body:not(.hide-panels):not(.kiosk) .leaflet-bottom.leaflet-left { left: 286px; } }
  .view-ctl a { font-weight: 700; font-size: 12px; }
  .view-ctl #btnLocate { font-size: 18px; font-weight: 400; }
  .view-ctl #btnLocate.busy { color: #3b82f6; }
  .region-lbl { background: rgba(10,15,22,.72); border: 0; color: #f1f5f9; font: 600 11px/1.2 system-ui, sans-serif; padding: 1px 5px; box-shadow: none; }
  .region-lbl::before { display: none; }
  .radar-ctl button.on { background: var(--accent, #38bdf8); color: #000; }
  .gen { border-radius: 50%; border: 1.5px solid #0b1118; box-shadow: 0 0 0 1px rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; }
  .gen svg { width: 78%; height: 78%; }
  .gen .blades { transform-origin: 0 -1px; animation: spin linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .gen .blades { animation: none; } }
  .spark { display: flex; align-items: flex-end; gap: 1px; height: 46px; margin: 4px 0 2px; }
  .spark i { flex: 1; min-width: 2px; border-radius: 1px 1px 0 0; }
  .ev { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #0b1118; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
  .leaflet-popup.has-fav .leaflet-popup-content { margin-right: 40px; }
  .leaflet-container a.fav-star { position: absolute; top: 3px; right: 24px; width: 20px; height: 20px; line-height: 20px; text-align: center;
    font-size: 17px; color: #94a3b8; text-decoration: none; z-index: 2; }
  .leaflet-container a.fav-star.on { color: #facc15; }
  .fav-pin { width: 22px; height: 22px; border-radius: 50%; background: #111821; border: 2px solid #facc15; display: flex; align-items: center;
    justify-content: center; font-size: 12px; box-shadow: 0 0 6px rgba(250,204,21,.6); }
  /* ================= film themes (Style menu): body[data-theme] ================= */
  #fx { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 450; overflow: hidden; display: none; }
  body[data-theme] #fx { display: block; }
  #fx > div { position: absolute; inset: 0; }
  #fx .cap { inset: auto; top: 8px; left: 50%; transform: translateX(-50%); font: 600 11px/1.5 var(--font-head); letter-spacing: .3em;
    width: max-content; max-width: calc(100% - 24px); text-align: center; color: var(--cap, var(--accent)); text-shadow: 0 0 6px var(--cap, var(--accent)); opacity: .85; }
  #fx .cap.b { top: auto; bottom: 24px; }  /* clear of the attribution line */
  @media (max-width: 760px) { #fx .cap { font-size: 9.5px; letter-spacing: .14em; } }
  /* Safari can paint filtered tiles over un-composited panes: give the panes above their own layers */
  body[data-theme] .leaflet-overlay-pane, body[data-theme] .leaflet-marker-pane, body[data-theme] .leaflet-tooltip-pane,
  body[data-theme] .leaflet-popup-pane { will-change: transform; }
  #boot { position: fixed; inset: 0; z-index: 5000; background: var(--bg); color: var(--accent); font: 18px/1.6 var(--font);
    padding: 12vh 10vw; letter-spacing: .08em; text-shadow: 0 0 8px var(--glow); cursor: pointer; transition: opacity .6s; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .cur::after { content: "█"; animation: blink 1s steps(1) infinite; margin-left: 4px; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  body[data-theme], body[data-theme] .leaflet-container { font-family: var(--font); }
  /* only the base map and its labels: radar and imagery keep their real colours */
  body[data-theme] .base-tiles { filter: var(--tile-filter); }
  body[data-theme] .label-tiles { filter: var(--label-filter); }
  body[data-theme] .panel h2, body[data-theme] #top h1 { font-family: var(--font-head); color: var(--accent); }
  body[data-theme] .leaflet-popup-content-wrapper, body[data-theme] .leaflet-popup-tip { background: var(--popup); color: var(--text); box-shadow: 0 0 14px var(--glow); }
  body[data-theme] .leaflet-popup-content-wrapper { border: 1px solid var(--line); }
  body[data-theme] .leaflet-popup-content b { color: var(--accent-hi); }
  body[data-theme] .leaflet-popup-content a, body[data-theme] .news .pin { color: var(--accent); }
  body[data-theme] #ticker .lbl { background: var(--ticker-bg); color: var(--ticker-fg); }
  body[data-theme] #top button, body[data-theme] select, body[data-theme] .bulk button, body[data-theme] #searchBox button,
  body[data-theme] #searchQ, body[data-theme] .chip, body[data-theme] .radar-ctl button { background: var(--btn); border-color: var(--line); color: var(--text); font-family: inherit; }
  body[data-theme] #searchBox, body[data-theme] #feedList, body[data-theme] .radar-ctl { background: var(--popup); border-color: var(--line); }
  body[data-theme] .leaflet-tooltip.lbl { background: var(--popup); color: var(--text); }
  body[data-theme] .leaflet-bar a { background: var(--btn); color: var(--accent); border-color: var(--line); }
  body[data-theme] .leaflet-control-attribution { background: var(--panel); color: var(--muted); }
  body[data-theme] .leaflet-control-attribution a { color: var(--muted); }
  /* corner brackets (Spy HQ, The Expanse) */
  body[data-theme="spy"] .panel, body[data-theme="expanse"] .panel, body[data-theme="spy"] #searchBox {
    --bk: var(--accent); background-color: var(--panel); background-repeat: no-repeat;
    background-image: linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)),
      linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk));
    background-size: 16px 2px, 2px 16px, 16px 2px, 2px 16px, 16px 2px, 2px 16px, 16px 2px, 2px 16px;
    background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%; }
  /* emergency squawks get a target lock (Spy HQ, The Expanse, Tron) */
  body[data-theme="spy"] .ac.pulse::before, body[data-theme="expanse"] .ac.pulse::before, body[data-theme="tron"] .ac.pulse::before {
    content: ""; position: absolute; inset: -12px; --bk: #ef4444; background-repeat: no-repeat;
    background-image: linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)),
      linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk));
    background-size: 9px 2px, 2px 9px, 9px 2px, 2px 9px, 9px 2px, 2px 9px, 9px 2px, 2px 9px;
    background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%; animation: lockon 1.1s ease-out infinite alternate; }
  body[data-theme="spy"] .ac.pulse::after, body[data-theme="expanse"] .ac.pulse::after, body[data-theme="tron"] .ac.pulse::after {
    content: "TARGET LOCK"; position: absolute; left: 50%; top: -28px; transform: translateX(-50%); font: 700 9px/1 var(--font);
    letter-spacing: .2em; color: #ef4444; text-shadow: 0 0 4px #000; white-space: nowrap; }
  @keyframes lockon { from { transform: scale(1.6) rotate(45deg); opacity: .2; } to { transform: none; opacity: 1; } }

  /* --- Spy HQ: satellite in cold teal, grid, radar sweep, classification banners --- */
  body[data-theme="spy"] {
    --bg: #02080c; --panel: rgba(2,14,20,.86); --line: #0f4c5c; --text: #cfeff3; --muted: #5f9aa6; --accent: #2dd4bf; --accent-hi: #a5f3fc;
    --glow: rgba(45,212,191,.25); --popup: rgba(3,18,26,.95); --btn: #052430; --ticker-bg: #7f1d1d; --ticker-fg: #fff; --cap: #f87171;
    --font: "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace; --font-head: var(--font);
    --tile-filter: grayscale(1) sepia(1) hue-rotate(150deg) saturate(2.2) brightness(.9) contrast(1.3);
    --label-filter: grayscale(1) sepia(1) hue-rotate(150deg) saturate(2.5) brightness(1.1); }
  body[data-theme="spy"] .panel, body[data-theme="spy"] #top, body[data-theme="spy"] #ticker { border-radius: 0; }
  body[data-theme="spy"] #fx .grid { background-image: linear-gradient(rgba(45,212,191,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(45,212,191,.08) 1px, transparent 1px);
    background-size: 64px 64px; }
  body[data-theme="spy"] #fx .rings { background: repeating-radial-gradient(circle at 50% 50%, transparent 0 139px, rgba(45,212,191,.13) 140px, transparent 141px); }
  body[data-theme="spy"] #fx .sweep { inset: auto; left: 50%; bottom: 50%; width: 75vmax; height: 75vmax; transform-origin: 0 100%;
    background: conic-gradient(from 0deg at 0 100%, rgba(45,212,191,.22), rgba(45,212,191,0) 40deg, transparent 90deg); animation: spin 9s linear infinite; }
  body[data-theme="spy"] #fx .scan { background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px); }
  body[data-theme="spy"] #fx .vig { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }

<script>
"use strict";
const API = "api/";
const params = new URLSearchParams(location.search);
// optional access token (ACCESS_TOKEN on the server) is passed on every request
const TOKEN = params.get("token");
const withToken = (url) => TOKEN ? url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN) : url;

const DEFAULTS = {
  layers: { ac_civil: true, ac_military: true, ac_police: true, ac_hems: true, ac_sar: true,
    ac_trails: true, mil_dest: true, airfields: true, army: true,

  regionMode: "carbon", basemap: "dark", theme: "standard", labels: "special", minAltFt: 0, newsHours: 12, newsMinSev: 1, quakeDays: 30, meteorHours: 36,

try { S = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("ukSit") || "{}"));
      S.layers = Object.assign({}, DEFAULTS.layers, S.layers || {}); }
catch (e) { S = structuredClone(DEFAULTS); }
const save = () => { try { localStorage.setItem("ukSit", JSON.stringify(S)); } catch (e) {} };

/* ------------------------------------------------------------ map */
const phone = matchMedia("(max-width: 760px)");
const HOME_ZOOM = 12;
const UK_VIEW = () => [[54.6, -3.2], phone.matches ? 5 : 6];
// Open on the home (remembered from the last visit, else as soon as the home feed says where it is).
// ?uk or ?z=6 opens on the whole country instead, as before.
const startUK = params.has("uk") || params.has("z");
let wantHome = !startUK;
const map = L.map("map", { zoomControl: false, preferCanvas: true, worldCopyJump: false, tap: true });
if (!startUK && S.homeAt) { map.setView(S.homeAt, HOME_ZOOM); wantHome = false; }
else map.setView(UK_VIEW()[0], params.get("z") ? +params.get("z") : UK_VIEW()[1]);
let noHome = false, homeAt = null;  // no home configured: ⌂ and the opening view use this device's location

let meMark = null, meCircle = null, locating = false;
function haLocation() {
  // Inside the Home Assistant panel (same origin through ingress), the signed-in user's person
  // entity has the companion app's GPS fix. That works even on http, where browsers refuse location.
  let w = window;
  try {
    while (w !== w.parent) {
      w = w.parent;
      const hass = w.document.querySelector("home-assistant")?.hass;
      if (!hass?.user) continue;
      const me = Object.values(hass.states).find((e) => e.entity_id.startsWith("person.") && e.attributes.user_id === hass.user.id);
      const a = me?.attributes;
      if (a?.latitude == null || a?.longitude == null) return null;
      return { lat: a.latitude, lon: a.longitude, acc: a.gps_accuracy || 0, who: a.friendly_name || me.entity_id, when: me.last_updated };
    }
  } catch (e) { /* a parent on another origin */ }
  return null;
}
function locate(quiet = false) {
  // Browsers only give a location to https pages (or localhost), and the user must allow it;
  // failing that, use Home Assistant's idea of where this user is.
  const fail = (msg) => {
    const h = haLocation();
    if (h) {
      const mins = Math.round((Date.now() - new Date(h.when)) / 60000);
      showMe([h.lat, h.lon], h.acc, `${h.who} in Home Assistant${mins > 2 ? `, ${mins < 120 ? mins + " min" : Math.round(mins / 60) + " h"} ago` : ""}`);
      if (!quiet && !window.isSecureContext) toast(`Location from Home Assistant (${h.who}): the app is on its http address, so the browser won't give one.`, 4000);
    } else if (!quiet) toast(msg);
  };
  if (!navigator.geolocation) return fail("This browser can't share its location.");
  if (!window.isSecureContext) return fail("Location only works over https: open the map through Home Assistant on its https address.");
  if (locating) return;
  locating = true; document.getElementById("btnLocate").classList.add("busy");
  navigator.geolocation.getCurrentPosition((p) => {
    locating = false; document.getElementById("btnLocate").classList.remove("busy");
    showMe([p.coords.latitude, p.coords.longitude], p.coords.accuracy, "You are here");
  }, (err) => {
    locating = false; document.getElementById("btnLocate").classList.remove("busy");
    fail(err.code === 1 ? "Location is blocked: allow it for this site in the browser (or app) settings."
      : err.code === 3 ? "Couldn't get a location in time; try again." : "Location isn't available right now.");

}

/* Military destination prediction: score airfields roughly ahead of the aircraft. */
function predictDest(a) {
  if (a.track == null || !a.gs || a.gs < 60 || a.alt === "ground") return null;
  let best = null;
  for (const [n, la, lo] of AIRFIELDS) {
    const d = distKm(a.lat, a.lon, la, lo);
    if (d > 400 || d < 3) continue;
    const off = angDiff(a.track, bearing(a.lat, a.lon, la, lo));
    if (off > 25) continue;
    const desc = (a.vrate ?? 0) < -300;
    const score = off / 25 * 0.5 + d / 400 * 0.3 + (desc ? 0 : 0.2);
    if (!best || score < best.score) best = { name: n, lat: la, lon: lo, d, off, desc, score };
  }
  if (!best) return null;
  const alt = typeof a.alt === "number" ? a.alt : 99999;
  best.conf = (best.desc && best.off < 10 && best.d < 150 && alt < 15000) ? "high"
    : (best.off < 15 && best.d < 250) ? "medium" : "low";
  best.eta = Math.round(best.d / (a.gs * 1.852) * 60);
  return best;
}

const BUS_MIN_ZOOM = 12, BUS_DIS_MIN_ZOOM = 9;
let busKey = null, busTimer = null, lastBusDis = [];
const busMarkers = new Map();
const GLYPH_BUS = '<rect x="-5" y="-6.5" width="10" height="11" rx="2" fill="#fff"/><rect x="-3.6" y="-4.8" width="7.2" height="4" fill="#92400e"/><circle cx="-2.5" cy="2" r=".9" fill="#92400e"/><circle cx="2.5" cy="2" r=".9" fill="#92400e"/><path d="M-3.4,4.5 v2.2 M3.4,4.5 v2.2" stroke="#fff" stroke-width="1.6"/>';
const busIcon = (b) => L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 13],
  html: `<div class="bus${Date.now() - new Date(b.at) > 180000 ? " old" : ""}">${b.bearing != null ? `<div class="dir" style="transform:rotate(${b.bearing}deg)"></div>` : ""}<div class="no">${esc(b.line || "?")}</div></div>` });
function busPopup(b) {
  return `<b>🚌 ${esc(b.line)}</b> to <b>${esc(b.dest || "?")}</b><br><span class="muted">${b.from ? `from ${esc(b.from)} · ` : ""}${esc(b.operator)}</span>
    <br><span class="muted" style="font-size:11px">Vehicle ${esc(b.vehicle || "?")} · position ${ago(b.at)}${b.dep ? ` · left ${ukTime(b.dep)}` : ""}</span>
    ${b.site ? `<br><a href="${esc(b.site)}" target="_blank" rel="noopener">${esc(b.operator)} ↗</a>` : ""}`;
}
function clearBuses() { G.buses.clearLayers(); busMarkers.clear(); busKey = null; counts.buses = undefined; renderCounts(); }
function refreshBuses(force) {
  clearTimeout(busTimer);
  if (!S.layers.buses || map.getZoom() < BUS_MIN_ZOOM) { if (busMarkers.size || busKey) clearBuses(); return; }
  const b = map.getBounds().pad(0.15);
  const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(v => v.toFixed(2)).join(",");
  if (bbox === busKey && !force) return;
  busTimer = setTimeout(async () => {
    busKey = bbox;
    const d = await getFeed("buses", `?bbox=${bbox}`);
    if (!d || !d.buses || busKey !== bbox) return;
    // move the markers we already have (keeps an open popup open), add new ones, drop the rest
    const seen = new Set();
    for (const x of d.buses) {
      seen.add(x.id);
      let m = busMarkers.get(x.id);
      if (m) { m.setLatLng([x.lat, x.lon]); m.setIcon(busIcon(x)); m.bus = x; continue; }
      m = L.marker([x.lat, x.lon], { icon: busIcon(x), zIndexOffset: 250 });
      m.bus = x;
      m.bindPopup(() => busPopup(m.bus), { maxWidth: 300 }).bindTooltip(() => `${esc(m.bus.line)} to ${esc(m.bus.dest || "?")}`, { direction: "top", offset: [0, -12] }).addTo(G.buses);
      busMarkers.set(x.id, m);
    }
    for (const [id, m] of busMarkers) if (!seen.has(id)) { m.remove(); busMarkers.delete(id); }
    counts.buses = d.buses.length; renderCounts();
  }, force ? 0 : 500);
}
const BUS_STOP_MIN_ZOOM = 15;
let busStopKey = null, busStopTimer = null;

const GLYPH_DROP = '<path d="M0,-6.5 C2.5,-2.5 5,0 5,2.5 A5,5 0 0 1 -5,2.5 C-5,0 -2.5,-2.5 0,-6.5 Z" fill="#fff"/><path d="M-3,1.5 h6 M-2.2,3.6 h4.4" stroke="#78350f" stroke-width="1.1"/>';

function renderSewage(d) {

// Lightning (Blitzortung)

// Air quality & pollen (Open-Meteo / CAMS, European AQI)
const AQI_BANDS = [[20, "#22c55e", "Good"], [40, "#84cc16", "Fair"], [60, "#eab308", "Moderate"], [80, "#f97316", "Poor"], [100, "#dc2626", "Very poor"], [1e9, "#7e22ce", "Extremely poor"]];
const aqiBand = (v) => AQI_BANDS.find(([max]) => v <= max) || AQI_BANDS[0];
let lastAir = [];
function renderAir(d) {
  if (d) lastAir = d.points || [];
  G.air.clearLayers();
  for (const p of lastAir) {
    if (p.aqi == null) continue;
    const [, col, label] = aqiBand(p.aqi);
    const pollen = Object.entries(p.pollen || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    L.marker([p.lat, p.lon], { icon: L.divIcon({ className: "base", iconSize: [26, 16], iconAnchor: [13, -6],
      html: `<div style="background:${col};color:#000;font:600 10px/16px system-ui;text-align:center;border-radius:8px;border:1px solid #000">${p.aqi}</div>` }) })
      .bindPopup(`<b>${esc(p.name)}</b> air quality<br>European AQI <b style="color:${col}">${p.aqi} (${label})</b><br>
        PM2.5 ${p.pm25 ?? "?"} · PM10 ${p.pm10 ?? "?"} · NO₂ ${p.no2 ?? "?"} · O₃ ${p.o3 ?? "?"} µg/m³<br>
        Pollen: ${pollen.length ? pollen.map(([k, v]) => `${k} ${Math.round(v)}`).join(", ") + " grains/m³" : "none detected"}<br><span class="muted" style="font-size:11px">CAMS model via Open-Meteo</span>`)
      .addTo(G.air);
  }
  counts.air = lastAir.filter(p => p.aqi > 40).length; renderCounts();
}

// Bathing waters (EA)
const BATHING_MIN_ZOOM = 9;
const BW_COL = { Excellent: "#2563eb", Good: "#16a34a", Sufficient: "#ca8a04", Poor: "#dc2626" };
const GLYPH_SWIM = '<circle cx="2.5" cy="-3.5" r="1.8" fill="#fff"/><path d="M-6,1.5 q1.5,-1.5 3,0 t3,0 t3,0 t3,0 M-5,-0.5 l4,-3 l3,2.5" stroke="#fff" stroke-width="1.4" fill="none"/>';
let lastBathing = [];
function bathingPopup(b) {
  const near = lastSewage.filter(o => (o.active || (o.end && ageMin(o.end) < 2880)) && distKm(b.lat, b.lon, o.lat, o.lon) < 3)
    .sort((x, y) => y.active - x.active);
  return `<b>${esc(b.name)}</b> bathing water<br>Classification: <b style="color:${BW_COL[b.classification] || "inherit"}">${esc(b.classification || "not classified")}</b><br>
    ${b.risk ? `Today's pollution risk: <b style="color:${b.risk === "normal" ? "#16a34a" : "#dc2626"}">${esc(b.risk)}</b><br>` : '<span class="muted">No daily forecast (outside May to September)</span><br>'}
    ${b.sample_date ? `Last sample ${b.sample_date.slice(6, 8)}/${b.sample_date.slice(4, 6)}/${b.sample_date.slice(0, 4)}<br>` : ""}
    ${near.length ? `<b style="color:#b45309">${near.length} storm overflow${near.length > 1 ? "s" : ""} within 3 km ${near.some(o => o.active) ? "discharging now" : "discharged in the last 48 h"}</b><br>` : ""}
    ${b.heavy_rain_risk ? '<span class="muted">Water quality can drop after heavy rain</span><br>' : ""}
    <a href="${esc(b.url)}" target="_blank" rel="noopener">EA bathing water profile ↗</a>`;
}
function renderBathing(d) {
  if (d) lastBathing = d.sites || [];
  G.bathing.clearLayers();
  counts.bathing = lastBathing.length; renderCounts();
  if (!S.layers.bathing || map.getZoom() < BATHING_MIN_ZOOM) return;
  const b = map.getBounds().pad(0.3);
  for (const w of lastBathing) {
    if (!b.contains([w.lat, w.lon])) continue;
    const alert = w.risk && w.risk !== "normal";
    fav(L.marker([w.lat, w.lon], { icon: emIcon(BW_COL[w.classification] || "#64748b", GLYPH_SWIM, alert), zIndexOffset: 260 })
      .bindPopup(() => bathingPopup(w)).bindTooltip(esc(w.name), { direction: "top", offset: [0, -10] }).addTo(G.bathing), "bathing", w);
  }
}

// NASA FIRMS fire hotspots
let lastFires = [];
function renderFires(d) {
  if (d) lastFires = d.fires || [];
  G.fires.clearLayers();
  for (const f of lastFires) {
    const h = ageMin(f.time) / 60;
    L.circleMarker([f.lat, f.lon], { radius: Math.min(9, 3 + Math.sqrt(f.frp || 1)), color: "#000", weight: 1,
      fillColor: h < 12 ? "#ef4444" : "#f97316", fillOpacity: h < 12 ? .9 : .55 })
      .bindPopup(`<b>Satellite heat detection</b><br>${ukDT(f.time)} (${ago(f.time)})<br>Fire radiative power ${f.frp} MW<br>
        VIIRS ${esc(f.sat || "")} · ${f.night ? "night" : "day"} pass · confidence ${esc({ l: "low", n: "nominal", h: "high" }[f.confidence] || f.confidence || "?")}<br>
        <span class="muted" style="font-size:11px">May be a wildfire, a controlled burn or an industrial heat source (steelworks, flares)</span>`)
      .addTo(G.fires);
  }
  counts.fires = lastFires.length; renderCounts();
}

// NASA GIBS satellite image (VIIRS true colour, yesterday: today's swaths are incomplete)
let satDate = null;
function renderSatImg() {
  const day = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  if (satDate === day) return;
  satDate = day;
  G.satimg.clearLayers();
  L.tileLayer(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/${day}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,
    { maxNativeZoom: 9, maxZoom: 18, opacity: .85, zIndex: 5, attribution: "NASA GIBS / VIIRS" }).addTo(G.satimg);
}

// ISS
let lastIss = null;
const GLYPH_SAT = '<rect x="-2" y="-2" width="4" height="4" fill="#fff"/><path d="M-8,-1.5 h5 v3 h-5 Z M3,-1.5 h5 v3 h-5 Z" fill="#93c5fd" stroke="#fff" stroke-width=".6"/>';
function renderIss(d) {
  if (d && !d.error) lastIss = d;
  G.iss.clearLayers();
  if (!lastIss) return;
  let seg = [], prev = null;
  const segs = [];
  for (const [la, lo] of lastIss.track) { if (prev != null && Math.abs(lo - prev) > 180) { segs.push(seg); seg = []; } seg.push([la, lo]); prev = lo; }
  segs.push(seg);
  for (const s of segs) L.polyline(s, { color: "#e2e8f0", weight: 1.2, opacity: .5, dashArray: "4 4", interactive: false }).addTo(G.iss);
  const passes = (lastIss.passes || []).map(p => `<tr><td>${ukDay(p.start)}</td><td><b>${ukTime(p.start)}</b> to ${ukTime(p.end)}</td><td>max ${p.max_el}°</td></tr>`).join("");
  L.marker([lastIss.lat, lastIss.lon], { icon: emIcon("#1e293b", GLYPH_SAT, false), zIndexOffset: 700 })
    .bindPopup(`<b>International Space Station</b><br>${lastIss.alt_km} km up · ${lastIss.sunlit ? "in sunlight" : "in Earth's shadow"}<br>
      ${lastIss.observer ? `Visible passes near ${lastIss.observer[0]}, ${lastIss.observer[1]} (map centre):` : ""}
      ${passes ? `<table class="tide-tbl">${passes}</table>` : '<br><span class="muted">No visible passes in the next 3 days</span>'}`)
    .bindTooltip("ISS").addTo(G.iss);
  renderAlerts();
}

// Street crime (police.uk, fetched for the map centre when zoomed right in)
const CRIME_MIN_ZOOM = 14;
const CRIME_NAMES = { "anti-social-behaviour": "Anti-social behaviour", "bicycle-theft": "Bicycle theft", burglary: "Burglary",
  "criminal-damage-arson": "Criminal damage & arson", drugs: "Drugs", "other-theft": "Other theft", "possession-of-weapons": "Weapons",
  "public-order": "Public order", robbery: "Robbery", shoplifting: "Shoplifting", "theft-from-the-person": "Theft from the person",
  "vehicle-crime": "Vehicle crime", "violent-crime": "Violence & sexual offences", "other-crime": "Other crime" };
let crimeKey = null, crimeTimer = null, crimeInfo = null;
const monthName = (ym) => ym ? new Date(ym + "-15").toLocaleDateString("en-GB", { month: "long", year: "numeric" }) : "?";
function refreshCrime() {
  clearTimeout(crimeTimer);
  if (!S.layers.crime || map.getZoom() < CRIME_MIN_ZOOM) {
    G.crime.clearLayers(); crimeKey = null; counts.crime = undefined; renderCounts();
    if (crimeInfo) { crimeInfo = null; renderAlerts(); }
    return;
  }
  const c = map.getCenter(), key = `${c.lat.toFixed(2)},${c.lng.toFixed(2)}`;
  if (key === crimeKey) return;
  crimeTimer = setTimeout(async () => {  // wait for panning to settle
    crimeKey = key;
    const d = await getFeed("crime", `?lat=${c.lat.toFixed(2)}&lon=${c.lng.toFixed(2)}`);
    if (!d || !d.spots || crimeKey !== key) return;
    G.crime.clearLayers();
    crimeInfo = d.older ? d : null; renderAlerts();
    const when = `${monthName(d.month)}${d.older ? ` <b style="color:#f59e0b">(older data: no ${monthName(d.latest)} figures published for this area)</b>` : ""}`;
    let total = 0;
    for (const s of d.spots) {
      const n = Object.values(s.crimes).reduce((a, b) => a + b, 0); total += n;
      L.circleMarker([s.lat, s.lon], { radius: Math.min(12, 3 + n * 1.2), color: "#000", weight: 1, fillColor: "#c084fc", fillOpacity: .75 })
        .bindPopup(`<b>${esc(s.street || "Street")}</b><br><span class="muted">${when} · police.uk</span><br>` +
          Object.entries(s.crimes).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${v} × ${esc(CRIME_NAMES[k] || k)}`).join("<br>"))
        .addTo(G.crime);
    }
    counts.crime = total; renderCounts();
  }, 600);
}

/* ------------------------------------------------------------ home area ("near me") */
const GLYPH_HOUSE = '<path d="M0,-6 L6.5,0 L4.5,0 L4.5,5.5 L-4.5,5.5 L-4.5,0 L-6.5,0 Z" fill="#fff"/><rect x="-1.5" y="1.5" width="3" height="4" fill="#0f172a"/>';
let lastHome = null;
document.addEventListener("change", async (e) => {
  if (e.target.id !== "homeSel") return;
  S.home = e.target.value; save();
  const d = await getFeed("home", `?home=${encodeURIComponent(S.home)}`);
  renderHome(d);
  if (d?.home) map.flyTo([d.home.lat, d.home.lon], HOME_ZOOM, { duration: 1 });
});
function renderHome(d) {
  if (d && !d.error) lastHome = d;
  G.home.clearLayers();
  const wrap = $("nearWrap");
  if (!lastHome) { if (String(d?.error || "").startsWith("disabled")) wrap.hidden = true; return; }
  const h = lastHome.home;
  if (wantHome) { map.setView([h.lat, h.lon], HOME_ZOOM); wantHome = false; }
  if (S.homeAt?.[0] !== h.lat || S.homeAt?.[1] !== h.lon) { S.homeAt = [h.lat, h.lon]; save(); }
  renderFavList();
  const row = (icon, text, ll, right = "") =>
    `<div class="row" ${ll ? `style="cursor:pointer" data-ll="${ll[0]},${ll[1]}"` : ""}><span>${icon} ${text}</span><span class="muted">${right}</span></div>`;
  L.circle([h.lat, h.lon], { radius: h.radius_km * 1000, color: "#f8fafc", weight: 1, opacity: .5, fill: false, dashArray: "6 6", interactive: false }).addTo(G.home);
  L.marker([h.lat, h.lon], { icon: emIcon("#334155", GLYPH_HOUSE, false), zIndexOffset: 800 }).bindTooltip(esc(h.name)).addTo(G.home);
  const r = [], d0 = lastHome;
  for (const w of d0.warnings || []) r.push(row("⚠️", esc(w.title), null));
  for (const f of d0.floods || []) r.push(row("🌊", `${esc(f.severity)}: ${esc(f.area)}`, [f.lat, f.lon], `${f.km} km`));
  const rv = d0.rivers || {};
  if (rv.raised?.length) for (const g of rv.raised) r.push(row("📈", `<b style="color:#f97316">${esc(g.river || g.name)} high</b> ${g.level} m ${g.trend > 0 ? "↑" : g.trend < 0 ? "↓" : ""}`, [g.lat, g.lon], `${g.km} km`));
  else if (rv.nearest?.length) r.push(row("〰️", "Rivers normal: " + rv.nearest.slice(0, 2).map(g => `${esc(g.river || g.name)} ${g.level} m${g.trend > 0 ? "↑" : g.trend < 0 ? "↓" : ""}`).join(", "), [rv.nearest[0].lat, rv.nearest[0].lon]));
  const sw = d0.sewage || {};
  for (const o of sw.active || []) r.push(row("🟤", `<b style="color:#d97706">Sewage discharging</b> into ${esc(o.water)}`, [o.lat, o.lon], `${o.km} km`));
  if (sw.recent?.length) r.push(row("🟤", `${sw.recent.length} overflow${sw.recent.length > 1 ? "s" : ""} stopped in 48 h · nearest ${esc(sw.recent[0].water)} (${ago(sw.recent[0].end)})`, null, `${sw.recent[0].km} km`));
  const bw = (d0.bathing || []).slice(0, 2);
  if (bw.length) r.push(row("🏖️", bw.map(b => `${esc(b.name)} <span style="color:${BW_COL[b.classification] || "inherit"}">${esc(b.classification || "?")}</span>${b.risk && b.risk !== "normal" ? ` <b style="color:#dc2626">risk ${esc(b.risk)}</b>` : ""}${b.sewage_near ? " 🟤" : ""}`).join(" · "), null));
  for (const f of (d0.fire || []).slice(0, 2)) r.push(row("🔥", `${esc(f.title)} · ${esc(f.location || "")}`, null, ago(f.time)));
  const closures = (d0.roads || []).filter(e => e.closure);
  if (closures.length) r.push(row("🚧", `${closures.length} road closure${closures.length > 1 ? "s" : ""}: ${esc((closures[0].roads || []).join(", ") || closures[0].type)}`, null, `${closures[0].km} km`));
  if (d0.power?.length) r.push(row("🔌", `${d0.power.length} power cut${d0.power.length > 1 ? "s" : ""} (${esc(d0.power[0].type)})`, null, `${d0.power[0].km} km`));
  for (const x of (d0.rnli || []).slice(0, 2)) r.push(row("🛟", `RNLI ${esc(x.station)} launched`, null, ago(x.time)));
  const ac = d0.aircraft || {};
  for (const a of ac.emergencies || []) r.push(row("✈️", `<b style="color:var(--emerg)">Squawk ${esc(a.squawk)}</b> ${esc(a.flight || a.hex)}`, null, `${a.km} km`));
  for (const e of ac.hems || []) r.push(row("🚁", `${esc(e.flight || e.hex)} on scene?`, null, `${e.km} km`));
  const lt = d0.lightning || {};
  if (lt.count_30min) r.push(row("⚡", `<b style="color:#facc15">${lt.count_30min} lightning strikes</b> in 30 min`, null, `nearest ${lt.nearest_km} km`));
  if (d0.tide?.next?.length) r.push(row("🌊", `${esc(d0.tide.station)}: ` + d0.tide.next.slice(0, 2).map(e => `${e.type === "HW" ? "High" : "Low"} ${ukTime(e.time)}`).join(", "), null));
  const fu = d0.fuel || {};
  if (fu.E10 || fu.B7_STANDARD) r.push(row("⛽", [fu.E10 && `Unl ${fu.E10.price.toFixed(1)}p ${esc(fu.E10.brand || "")}`, fu.B7_STANDARD && `Dsl ${fu.B7_STANDARD.price.toFixed(1)}p ${esc(fu.B7_STANDARD.brand || "")}`].filter(Boolean).join(" · "),
    fu.E10 ? [fu.E10.lat, fu.E10.lon] : [fu.B7_STANDARD.lat, fu.B7_STANDARD.lon], "cheapest"));
  const pass = d0.iss?.passes?.[0];
  if (pass) r.push(row("🛰️", `ISS ${ukDay(pass.start)} ${ukTime(pass.start)}, max ${pass.max_el}°`, null));
  if (d0.air) r.push(row("🌬️", `Air quality ${d0.air.aqi} (${aqiBand(d0.air.aqi)[2]})${Object.keys(d0.air.pollen || {}).length ? " · pollen: " + Object.keys(d0.air.pollen).join(", ") : ""}`, null));
  if (ac.overhead != null) r.push(row("✈️", `${ac.overhead} aircraft within 10 km`, null));
  for (const b of d0.rail?.boards || []) {
    const next = b.services.slice(0, 3).map(t => `${t.std} ${esc(t.dest)} ${railStatus(t, true)}`).join(" · ");
    r.push(row("🚆", `<b>${esc(b.name)}</b> ${next || '<span class="muted">no departures soon</span>'}`, null));
  }
  for (const x of d0.rail?.disruptions || []) r.push(row("🚆", `<b style="color:#fb7185">${esc(x.text.slice(0, 120))}</b>`, null));
  const bs = d0.bus?.stop;
  if (bs) r.push(row("🚏", `<b>${esc(bs.name)}</b> ${bs.departures.map(x => `${ukTime(x.time)} <b>${esc(x.line)}</b> ${esc(x.dest || "")}${x.live ? " 🛰" : ""}`).join(" · ") || '<span class="muted">no buses soon</span>'}`, [bs.lat, bs.lon]));
  const nb = d0.bus?.near || [];
  if (nb.length) r.push(row("🚌", nb.slice(0, 4).map(b => `<b>${esc(b.line)}</b> to ${esc(b.dest || "?")} <span class="muted">${b.km} km</span>`).join(" · "), null));
  for (const x of d0.bus?.disruptions || []) r.push(row("🚌", `<b style="color:${x.planned ? "#fbbf24" : "#fb923c"}">${esc(x.summary)}</b>${x.lines.length ? ` <span class="muted">(${esc(x.lines.join(", "))})</span>` : ""}`, null));
  const en = d0.energy || {};
  if (en.agile) {
    const a = en.agile, neg = a.negative || [];
    r.push(row("⚡", `Agile <b style="color:${agileCol(a.now)}">${a.now.toFixed(1)}p</b> now${a.next != null ? ` → ${a.next.toFixed(1)}p` : ""}${a.cheap ? ` · cheapest 3 h ${ukDay(a.cheap.start)} ${ukTime(a.cheap.start)}–${ukTime(a.cheap.end)} (avg ${a.cheap.p.toFixed(1)}p)` : ""}`
      + neg.map(x => ` · <b style="color:#38bdf8">negative ${ukDay(x.start)} ${ukTime(x.start)}–${ukTime(x.end)} (to ${x.min}p)</b>`).join(""), null));
  }
  if (en.carbon) {
    const c = en.carbon;
    r.push(row("🌱", `Grid here <b style="color:${CI_COL[c.index] || "inherit"}">${c.g} g/kWh</b> (${esc(c.index)})${c.clean ? ` · cleanest 3 h ${ukDay(c.clean.start)} ${ukTime(c.clean.start)}–${ukTime(c.clean.end)} (${c.clean.g} g)` : ""}`
      + (en.solar?.mw > 0 ? ` · ☀️ ${en.solar.mw.toLocaleString()} MW solar (${Math.round(en.solar.mw / en.solar.cap * 100)}%)` : ""), null));
  }
  const homes = d0.homes || [];
  $("nearTitle").innerHTML = homes.length > 1
    ? `Near <select id="homeSel" title="Which home">${homes.map(x => `<option value="${esc(x.key)}"${x.key === h.key ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select> (${h.radius_km} km)`
    : `Near ${esc(h.name)} (${h.radius_km} km)`;
  $("near").innerHTML = r.join("") || '<span class="muted">All quiet</span>';
  wrap.hidden = false;
}

/* ------------------------------------------------------------ fuel prices (GOV.UK Fuel Finder) */
const FUEL_MIN_ZOOM = 11;
const FUEL_NAMES = { E10: "Unleaded (E10)", E5: "Super unleaded (E5)", B7_STANDARD: "Diesel", B7_PREMIUM: "Premium diesel", B10: "Diesel (B10)", HVO: "HVO" };
let fuelKey = null, fuelTimer = null, fuelNational = null;
// [match prefix, display name, favicon domain (checked by eye) or null, badge colours + text when there's no good icon]
const FUEL_BRANDS = [
  ["esso", "Esso", "esso.co.uk"], ["bp", "BP", null, "#009900", "#ffe600", "bp"], ["shell", "Shell", "shell.co.uk"],
  ["tesco", "Tesco", "tesco.com"], ["texaco", "Texaco", "texaco.co.uk"], ["morrisons", "Morrisons", "morrisons.com"],
  ["sainsbury", "Sainsbury's", null, "#f06c00", "#fff", "S"], ["jet", "Jet", "jetlocal.co.uk"], ["gulf", "Gulf", "gulfoil.co.uk"],
  ["valero", "Valero", null, "#0a3d91", "#ffc72c", "V"], ["murco", "Murco", null, "#d71920", "#fff", "M"],
  ["eg", "EG", null, "#000", "#e4002b", "EG"], ["maxol", "Maxol", "maxol.ie"], ["pace", "Pace", "pacefuelcare.co.uk"],
  ["solo", "Solo", null, "#1d4ed8", "#fff", "S"], ["circle k", "Circle K", "circlek.com"], ["welcome break", "Welcome Break", "welcomebreak.co.uk"],
  ["essar", "Essar", "essar.com"], ["gleaner", "Gleaner", "gleaner.co.uk"], ["spar", "Spar", "spar.co.uk"],
  ["highland fuels", "Highland Fuels", "highlandfuels.co.uk"], ["the co-op", "Co-op", "coop.co.uk"], ["co-op", "Co-op", "coop.co.uk"],
  ["east of england co-op", "Co-op", "coop.co.uk"], ["costco", "Costco", null, "#e31837", "#fff", "C"], ["total", "TotalEnergies", "totalenergies.co.uk"],
  ["applegreen", "Applegreen", "applegreenstores.com"], ["emo", "Emo", "emo-oil.com"], ["harvest", "Harvest", null, "#15803d", "#fff", "H"],
  ["go", "Go", null, "#facc15", "#000", "GO"],
];
function fuelBrand(o) {
  const raw = (o.brand || "").trim(), b = raw.toLowerCase();
  // short keys (bp, eg, go, jet) must be a whole word; longer ones can prefix ("sainsburys", "total energies")
  const m = FUEL_BRANDS.find(([k]) => b === k || b.startsWith(k + " ") || (k.length > 3 && b.startsWith(k)));
  if (m) return { name: m[1], domain: m[2], badge: m[3] ? m.slice(3) : null };
  const generic = !raw || /^(none|unbranded|independ[ae]nt)$/i.test(raw);
  // independents: a short version of the trading name instead
  const name = (generic ? o.name : raw).replace(/\b(petrol filling station|filling station|service station|services|garage|ltd|limited)\b/gi, "").replace(/[-,]+/g, " ").trim();
  return { name: name.split(/\s+/).slice(0, 2).join(" ") || "Fuel", domain: null, badge: ["#475569", "#fff", (name[0] || "?").toUpperCase()] };
}
function fuelLogo(br, size) {
  const badge = (b) => `<span style="display:inline-block;width:${size}px;height:${size}px;border-radius:3px;background:${b[0]};color:${b[1]};font:700 ${b[2].length > 1 ? size * .5 : size * .7}px/${size}px system-ui;text-align:center;vertical-align:middle">${esc(b[2])}</span>`;
  if (!br.domain) return badge(br.badge || ["#475569", "#fff", "?"]);

/* ------------------------------------------------------------ tide times (Admiralty EasyTide) */
const TIDE_MIN_ZOOM = 9;
let tideStations = [];
const tideIcon = L.divIcon({ className: "base", iconSize: [18, 18], iconAnchor: [9, 9],
  html: '<svg width="18" height="18" viewBox="-9 -9 18 18"><circle r="8" fill="#1d4ed8" stroke="#000" stroke-width="1"/>' +
    '<path d="M-5.5,-0.5 q1.4,-2 2.75,0 t2.75,0 t2.75,0 t2.75,0 M-5.5,3 q1.4,-2 2.75,0 t2.75,0 t2.75,0 t2.75,0" stroke="#fff" stroke-width="1.4" fill="none"/></svg>' });
const ukTime = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/London" });
function ukDay(iso) {
  const f = (d) => d.toLocaleDateString("en-GB", { timeZone: "Europe/London" });
  const d = new Date(iso), now = new Date();
  if (f(d) === f(now)) return "Today";
  if (f(d) === f(new Date(now.getTime() + 86400000))) return "Tomorrow";
  return d.toLocaleDateString("en-GB", { weekday: "short", timeZone: "Europe/London" });
}
function tideChart(curve, events) {
  // height curve from 6 h ago to 24 h ahead, with a "now" line and HW/LW dots
  const now = Date.now(), t0 = now - 6 * 3600e3, t1 = now + 24 * 3600e3;
  const pts = curve.map(([t, h]) => [Date.parse(t), h]).filter(([t]) => t >= t0 && t <= t1);
  if (pts.length < 3) return "";
  const hs = pts.map(p => p[1]), lo = Math.min(...hs), hi = Math.max(...hs), W = 260, H = 64;
  const x = (t) => ((t - t0) / (t1 - t0) * W).toFixed(1), y = (h) => (H - 4 - (h - lo) / (hi - lo || 1) * (H - 14)).toFixed(1);
  const path = pts.map(([t, h], i) => `${i ? "L" : "M"}${x(t)},${y(h)}`).join(" ");
  const dots = events.filter(e => { const t = Date.parse(e.time); return t >= t0 && t <= t1 && e.height != null; })
    .map(e => `<circle cx="${x(Date.parse(e.time))}" cy="${y(e.height)}" r="2.5" fill="${e.type === "HW" ? "#60a5fa" : "#94a3b8"}"/>`).join("");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;margin:6px 0;background:#0b1220;border-radius:4px">
    <path d="${path} L${x(pts[pts.length - 1][0])},${H} L${x(pts[0][0])},${H} Z" fill="#1d4ed833"/><path d="${path}" stroke="#60a5fa" stroke-width="1.6" fill="none"/>
    <line x1="${x(now)}" x2="${x(now)}" y1="0" y2="${H}" stroke="#facc15" stroke-dasharray="3 2"/>${dots}</svg>`;
}
function tidePopup(st, d) {
  const head = `<b>${esc(st.name)}</b> <span class="muted">tide times</span><br>`;
  if (!d) return head + '<span class="muted">Loading…</span>';
  if (d.error || !d.events) return head + `<span class="muted">Tide data unavailable (${esc(d.error || "no data")})</span>`;
  const now = Date.now();
  const next = d.events.filter(e => Date.parse(e.time) > now - 15 * 60e3).slice(0, 5);
  // rising or falling: compare the curve either side of now
  let state = "";
  const c = d.curve.map(([t, h]) => [Date.parse(t), h]);
  const i = c.findIndex(([t]) => t > now);
  if (i > 0) {
    const [ta, ha] = c[i - 1], [tb, hb] = c[i], h = ha + (hb - ha) * (now - ta) / (tb - ta);
    state = `Now ${h.toFixed(1)} m, ${hb > ha ? "rising ↑" : "falling ↓"}`;
  }
  const rows = next.map(e => `<tr><td>${e.type === "HW" ? "High" : "Low"}</td><td>${ukDay(e.time)}</td><td><b>${ukTime(e.time)}</b></td>
    <td style="text-align:right">${e.height != null ? e.height.toFixed(1) + " m" : ""}</td></tr>`).join("");
  return head + (state ? `<span>${state}</span>` : "") + tideChart(d.curve, d.events) +
    `<table class="tide-tbl">${rows}</table><span class="muted" style="font-size:11px">UK time · heights above chart datum · Admiralty EasyTide, not for navigation</span>`;
}
function renderTides(d) {

  if (map.getZoom() < TIDE_MIN_ZOOM || !S.layers.tides) return;

}

      html: `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M9 1 L3 9 H7 L6 15 L13 6 H9 Z" fill="${planned ? "#94a3b8" : "#fbbf24"}" stroke="#000" stroke-width=".8"/></svg>` }) })
      .bindPopup(`<b>Power cut · ${esc(c.dno)}</b><br>${esc(c.type || "")}<br>${esc(c.area || "")}<br>
        ${c.customers ? c.customers + " customers · " : ""}since ${ago(c.since)}${c.eta ? "<br>ETR " + new Date(c.eta).toLocaleString() : ""}`)
      .addTo(G.cuts);
  }
  counts.cuts = cuts.length; renderCounts();
}

/* ------------------------------------------------------------ roads */
let lastRoads = [];
function renderRoads(d) {
  G.roads_incidents.clearLayers(); G.roads_closures.clearLayers(); G.roads_works.clearLayers();
  if (!d) return;
  if (d.error === "no_key") { setStatus("roads", false, "Add national_highways_key"); return; }
  if (d.errors && d.errors.length) setStatus("roads", false, d.errors.join("; "));
  lastRoads = d.events || [];
  for (const e of lastRoads) {
    const layer = e.kind === "unplanned" ? G.roads_incidents : e.full_closure ? G.roads_closures : G.roads_works;
    const col = e.kind === "unplanned" ? "#ef4444" : e.full_closure ? "#f59e0b" : "#94a3b8";
    const popup = `<b>${esc(e.roads.join(", ") || "Road")}</b> · ${e.kind === "unplanned" ? '<b style="color:#ef4444">' + esc(e.type) + "</b>" + (e.source ? ` <span class="muted">(${esc(e.source)})</span>` : "") : e.full_closure ? "Carriageway closure" : "Lane restriction"}<br>
      ${esc(e.where)}<p>${esc(e.comment)}</p><span class="muted">${esc(e.cause || "")}${e.start ? " · from " + new Date(e.start).toLocaleString("en-GB") : ""}${e.end ? " to " + new Date(e.end).toLocaleString("en-GB") : ""}</span>`;
    for (const line of e.lines) {
      if (line.length > 1) L.polyline(line, { color: col, weight: e.kind === "unplanned" ? 5 : e.full_closure ? 4 : 2.5, opacity: .9 }).bindPopup(popup).addTo(layer);
    }
    const mid = e.lines[0][Math.floor(e.lines[0].length / 2)];
    if (e.kind === "unplanned" || e.full_closure)
      L.circleMarker(mid, { radius: e.kind === "unplanned" ? 6 : 4, color: "#000", weight: 1, fillColor: col, fillOpacity: 1 }).bindPopup(popup).addTo(layer);
  }
  counts.roads = { incidents: lastRoads.filter(e => e.kind === "unplanned").length,
    closures: lastRoads.filter(e => e.kind === "planned" && e.full_closure).length,
    works: lastRoads.filter(e => e.kind === "planned" && !e.full_closure).length };
  renderCounts(); renderAlerts();
}

/* ------------------------------------------------------------ space & quakes */
let lastSpace = null, lastQuakes = [];
function renderSpace(d) {
  if (!d) return;
  lastSpace = d;
  const kp = d.kp ?? null;
  const kpCol = kp == null ? "#94a3b8" : kp >= 7 ? "#ef4444" : kp >= 5 ? "#f59e0b" : kp >= 4 ? "#facc15" : "#22c55e";
  const awCol = { green: "#22c55e", yellow: "#facc15", amber: "#f59e0b", red: "#ef4444" }[d.aurorawatch] || "#94a3b8";
  $("space").innerHTML = `
    <div class="row"><span>Planetary Kp</span><b style="color:${kpCol}">${kp != null ? kp.toFixed(2) : "—"}${kp >= 5 ? " · G" + Math.min(5, Math.floor(kp) - 4) + " storm" : ""}</b></div>
    <div class="row"><span>AuroraWatch UK</span><b style="color:${awCol}">${esc((d.aurorawatch || "—").toUpperCase())}</b></div>
    ${(d.alerts || []).slice(0, 3).map(a => `<div class="muted" style="font-size:11px;margin-top:3px">${esc(a.text)} · ${ago(a.issued)}</div>`).join("")}`;
  renderAlerts();
}
function renderQuakes(d) {
  G.quakes.clearLayers();
  lastQuakes = d?.quakes || [];
  const cutoff = Date.now() - S.quakeDays * 864e5;
  let n = 0;
  for (const q of lastQuakes) {
    const t = new Date(q.time);
    if (t < cutoff) continue;
    n++;
    const ageH = (Date.now() - t) / 36e5;
    L.circleMarker([q.lat, q.lon], { radius: 3 + Math.max(0, q.mag ?? 0) * 3, color: "#f472b6", weight: 1.5,
      fillColor: "#f472b6", fillOpacity: ageH < 24 ? .7 : ageH < 168 ? .35 : .12 })
      .bindPopup(`<b>M${q.mag} earthquake</b><br>${esc(q.place)}<br>${new Date(q.time).toLocaleString()} (${ago(q.time)})<br>Depth ${q.depth} km<br><a href="${esc(q.link)}" target="_blank" rel="noopener">BGS ↗</a>`)
      .addTo(G.quakes);
  }
  counts.quakes = n; renderCounts();
}

/* ------------------------------------------------------------ meteors */
let lastMeteors = [];
const SHOWER_COL = ["#22d3ee", "#a3e635", "#f0abfc", "#fde047", "#93c5fd", "#fdba74"];
function renderMeteors(d) {
  if (d) lastMeteors = (d.meteors || []).map(m => ({ ...m, name: (m.name || "").trim() || "Sporadic" }));
  G.meteors.clearLayers();
  const cutoff = Date.now() - S.meteorHours * 36e5;
  const list = lastMeteors.filter(m => new Date(m.time) >= cutoff);
  const showers = {};
  for (const m of list) if (m.shower && m.shower !== "spo") showers[m.shower] = (showers[m.shower] || 0) + 1;
  const ranked = Object.entries(showers).sort((a, b) => b[1] - a[1]);
  const colFor = (m) => m.mag <= -4 ? "#ff7a1a" : (!m.shower || m.shower === "spo") ? "#a5b4fc"
    : SHOWER_COL[Math.max(0, ranked.findIndex(r => r[0] === m.shower)) % SHOWER_COL.length];
  for (const m of list) {
    const fireball = m.mag <= -4, bright = m.mag <= -1;
    const ageH = (Date.now() - new Date(m.time)) / 36e5;
    const col = colFor(m);
    const popup = `<b>${fireball ? "🔥 Fireball" : "☄️ Meteor"} · ${esc(m.name || "Sporadic")}</b><br>
      ${new Date(m.time).toLocaleString("en-GB")} (${ago(m.time)})<br>
      Abs. mag ${m.mag} · ${m.vg} km/s · ${m.dur}s<br>
      Height ${m.h1} → ${m.h2} km · seen by ${m.stations} cameras<br>
      <a href="https://archive.ukmeteors.co.uk/reports/${m.id.slice(0, 4)}/orbits/${m.id.slice(0, 6)}/${m.id.slice(0, 8)}/${esc(m.id)}/index.html" target="_blank" rel="noopener">UKMON report ↗</a>`;
    const opacity = ageH < 12 ? .9 : .45;
    L.polyline([[m.lat1, m.lon1], [m.lat2, m.lon2]], { color: col, weight: fireball ? 5 : bright ? 3 : 1.6, opacity }).bindPopup(popup).addTo(G.meteors);
    // small head at the end point (where it burned out)
    L.circleMarker([m.lat2, m.lon2], { radius: fireball ? 5 : bright ? 3 : 1.5, weight: 0, fillColor: fireball ? "#fff3c4" : col, fillOpacity: opacity }).bindPopup(popup).addTo(G.meteors);
  }
  counts.meteors = list.length; renderCounts();
  const brightest = list.reduce((a, b) => (!a || b.mag < a.mag) ? b : a, null);
  $("meteors").innerHTML = list.length ? `
    <div class="row"><span>Meteors (${S.meteorHours} h)</span><b>${list.length}</b></div>
    ${ranked.slice(0, 3).map(([k, n]) => { const ex = list.find(m => m.shower === k); return `<div class="row"><span><span class="sev" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colFor(ex)}"></span> ${esc(ex.name)}</span><span class="muted">${n}</span></div>`; }).join("")}
    ${brightest ? `<div class="row" style="cursor:pointer" data-ll="${brightest.lat2},${brightest.lon2}"><span>Brightest</span><span class="muted">mag ${brightest.mag} · ${ago(brightest.time)}</span></div>` : ""}`
    : '<span class="muted">No matched meteors yet (UKMON processes overnight)</span>';
  renderAlerts();
}

/* ------------------------------------------------------------ news */
let lastNews = [];
const TICKER_PX_PER_SEC = 110;
const isWelsh = (i) => /\/cymrufyw\//.test(i.link || "");
const SEV_COL = { 3: "#ef4444", 2: "#f59e0b", 1: "#64748b" };
function renderNews(d) {
  if (d) lastNews = (d.items || []).filter(i => !isWelsh(i));
  G.news.clearLayers();
  const cutoff = Date.now() - S.newsHours * 36e5;
  const items = lastNews.filter(i => i.published && new Date(i.published) >= cutoff && i.severity >= S.newsMinSev);
  // stack markers sharing the same place so they don't hide each other
  const byPlace = {};
  for (const i of items) if (i.lat != null) (byPlace[i.place] ||= []).push(i);
  for (const list of Object.values(byPlace)) {
    const top = list.reduce((a, b) => b.severity > a.severity ? b : a);
    const ageH = (Date.now() - new Date(top.published)) / 36e5;
    L.circleMarker([top.lat, top.lon], { radius: 6 + Math.min(list.length, 5), color: "#fff", weight: 1,
      fillColor: SEV_COL[top.severity], fillOpacity: ageH < 2 ? .95 : ageH < 6 ? .7 : .4 })
      .bindPopup(`<b>${esc(top.place)}</b>` + list.map(i => `<p><b>${esc(i.title)}</b><br>${esc(i.summary)}<br><span class="muted">${ago(i.published)} · BBC ${esc(i.region)}</span> <a href="${esc(i.link)}" target="_blank" rel="noopener">↗</a></p>`).join(""), { maxWidth: 320 })
      .addTo(G.news);
  }
  $("newslist").innerHTML = items.slice(0, 12).map(i => `
    <div class="news" title="${esc(i.summary)}">
      <span class="sev" style="background:${SEV_COL[i.severity]}"></span><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)} ↗</a>
      <div class="muted" style="font-size:11px">${ago(i.published)}${i.place ? ` · <span class="pin" data-ll="${i.lat},${i.lon}">📍 ${esc(i.place)}</span>` : ""}</div>
    </div>`).join("") || '<span class="muted">Nothing in this window</span>';
  const tick = items.slice(0, 20).map(i => `<a href="${esc(i.link)}" target="_blank" rel="noopener">${i.severity === 3 ? "🔴 " : ""}${esc(i.title)}</a>`).join("");
  const track = $("tickerTrack");
  if (track.dataset.sig !== tick) {
    track.innerHTML = tick; track.dataset.sig = tick;
    // constant reading speed regardless of how many headlines there are
    track.style.animationDuration = Math.max(20, (track.scrollWidth + innerWidth) / TICKER_PX_PER_SEC) + "s";
  }
  counts.news = items.length; renderCounts();
}

/* ------------------------------------------------------------ alerts panel */
function renderAlerts() {
  const out = [];
  for (const a of lastAircraft.filter(a => a.emergency))
    out.push({ cls: "", ll: [a.lat, a.lon], html: `✈️ <b>${esc(a.flight || a.reg || a.hex)}</b> squawk ${esc(a.squawk)} — ${esc(a.emergency)}<small>${a.alt ?? "?"} ft · ${esc(a.type || "")}</small>` });
  for (const v of lastVessels.filter(v => v.cls === "distress"))
    out.push({ cls: "", ll: [v.lat, v.lon], html: `🆘 AIS distress beacon ${v.mmsi}<small>${esc(v.name || "")}</small>` });
  for (const w of lastWarnings.filter(w => w.level !== "yellow"))
    out.push({ cls: w.level === "red" ? "" : "amber", ll: [w.lat, w.lon], html: `⚠️ ${esc(w.title)}` });
  const yellow = lastWarnings.filter(w => w.level === "yellow");
  if (yellow.length) {
    const titles = [...new Set(yellow.map(w => w.title.replace(/ affecting.*$/i, "")))];
    out.push({ cls: "yellow", html: `⚠️ ${titles.map(esc).join(", ")}<small>${new Set(yellow.map(w => w.region)).size} regions</small>` });
  }
  const inc = lastRoads.filter(e => e.kind === "unplanned");
  for (const e of inc.filter(e => e.full_closure).slice(0, 5))
    out.push({ cls: "", ll: e.lines[0][0], html: `🚧 ${esc(e.roads.join(", "))} closed — ${esc(e.type)}<small>${esc(e.where)}</small>` });
  const incOther = inc.filter(e => !e.full_closure);
  if (incOther.length) out.push({ cls: "info", ll: incOther.length === 1 ? incOther[0].lines[0][0] : null, html: `🚗 ${incOther.length} live lane closure${incOther.length > 1 ? "s" : ""} on National Highways roads<small>${esc([...new Set(incOther.map(e => e.where))].slice(0, 6).join(" · "))}</small>` });
  const gales = lastSea.filter(p => p.wind_kn != null && beaufort(p.wind_kn) >= 8);
  if (gales.length) out.push({ cls: "amber", ll: [gales[0].lat, gales[0].lon], html: `🌬️ Gale force winds at sea<small>${esc(gales.map(p => p.name + " F" + beaufort(p.wind_kn)).join(", "))}</small>` });
  const rough = lastSea.filter(p => p.wave >= 4);
  if (rough.length) out.push({ cls: rough.some(p => p.wave >= 6) ? "" : "amber", ll: [rough[0].lat, rough[0].lon], html: `🌊 ${seaState(Math.max(...rough.map(p => p.wave)))[1]} seas<small>${esc(rough.map(p => `${p.name} ${p.wave.toFixed(1)}m`).join(", "))}</small>` });
  for (const e of lastHems.filter(e => ageMin(e.last) < 30))
    out.push({ cls: "info", ll: [e.lat, e.lon], html: `🚁 ${e.cls === "sar" ? "Coastguard helicopter" : "Air ambulance"} ${esc(e.flight || "")} probably on scene<small>${ago(e.first)}</small>` });
  if (S.layers.rail_disruptions) for (const x of lastRailDis.filter(x => x.kind === "Disruption" && /^(No trains|Disruption|Major disruption|Lines? (are )?(closed|blocked)|Reduced service|Trains .*(cancelled|delayed))/i.test(x.text)).slice(0, 4))
    out.push({ cls: "info", ll: x.stations.length ? [x.stations[0].lat, x.stations[0].lon] : null, html: `🚆 ${esc(x.text.split(/(?<=\.)\s/)[0].slice(0, 140))}<small>${esc(x.operators.join(", ") || "National Rail")}</small>` });
  for (const l of lastRnli.filter(l => l.time && ageMin(l.time) < 60))
    out.push({ cls: "info", ll: l.lat != null ? [l.lat, l.lon] : null, html: `🛟 RNLI ${esc(l.station)} ${l.boats?.length > 1 ? `${l.boats.length} lifeboats` : "lifeboat"} launched<small>${ago(l.time)}</small>` });
  for (const f of lastFire.filter(f => f.status === "Ongoing" && ageMin(f.time) < 1440))
    out.push({ cls: "amber", ll: [f.lat, f.lon], html: `🔥 ${esc(f.title)} — ${esc(f.location || f.area || "")}<small>DSFRS · ${ago(f.time)}</small>` });
  const severe = lastFloods.filter(f => f.level <= 2);
  if (severe.length) out.push({ cls: severe.some(f => f.level === 1) ? "" : "amber", html: `🌊 ${severe.length} flood warning${severe.length > 1 ? "s" : ""} in force<small>${esc([...new Set(severe.map(f => f.county))].slice(0, 4).join(", "))}</small>` });
  else if (lastFloods.length) out.push({ cls: "yellow", html: `🌊 ${lastFloods.length} flood alert${lastFloods.length > 1 ? "s" : ""}` });
  for (const q of lastQuakes.filter(q => (Date.now() - new Date(q.time)) < 864e5))
    out.push({ cls: q.mag >= 2.5 ? "amber" : "info", ll: [q.lat, q.lon], html: `🌍 M${q.mag} ${esc(q.place)}<small>${ago(q.time)}</small>` });
  for (const m of lastMeteors.filter(m => m.mag <= -4 && (Date.now() - new Date(m.time)) < 864e5))
    out.push({ cls: "info", ll: [m.lat2, m.lon2], html: `🔥 Fireball mag ${m.mag} over the UK<small>${ago(m.time)} · ${m.stations} cameras</small>` });
  if (lastSpace && lastSpace.kp >= 5) out.push({ cls: lastSpace.kp >= 7 ? "" : "amber", html: `🌌 Geomagnetic storm Kp ${lastSpace.kp}` });
  if (lastSpace && ["amber", "red"].includes(lastSpace.aurorawatch)) out.push({ cls: "amber", html: `🌌 AuroraWatch UK ${lastSpace.aurorawatch.toUpperCase()} — aurora possible` });
  const raised = lastRivers.filter(g => g.state === "record" || g.state === "high");
  if (raised.length) out.push({ cls: raised.some(g => g.state === "record") ? "amber" : "info", ll: raised.length === 1 ? [raised[0].lat, raised[0].lon] : null,
    html: `🌊 ${raised.length} river gauge${raised.length > 1 ? "s" : ""} above normal range<small>${raised.slice(0, 4).map(g => esc(g.river || g.name)).join(", ")}${raised.length > 4 ? "…" : ""}</small>` });
  const nowS = Date.now() / 1000, recentStrikes = lastStrikes.filter(([t, la, lo]) => nowS - t < 1800 && la > 49.8 && la < 60.9 && lo > -8.7 && lo < 1.9);
  if (recentStrikes.length) out.push({ cls: "info", ll: [recentStrikes.at(-1)[1], recentStrikes.at(-1)[2]], html: `⚡ ${recentStrikes.length} lightning strike${recentStrikes.length > 1 ? "s" : ""} over the UK in the last 30 min` });
  const soon = lastIss?.passes?.find(p => Date.parse(p.end) > Date.now() && Date.parse(p.start) - Date.now() < 3 * 3600e3);
  if (S.layers.iss && soon) out.push({ cls: "info", html: `🛰️ ISS visible ${ukTime(soon.start)} to ${ukTime(soon.end)}, max ${soon.max_el}°<small>near map centre</small>` });
  if (S.layers.tfl) for (const l of lastTfl.filter(l => l.severity < 10 || [11, 15, 16, 17].includes(l.severity)))
    out.push({ cls: [1, 2, 3, 6].includes(l.severity) ? "amber" : "info", html: `🚇 ${esc(l.name)}: ${esc(l.status)}<small>${esc((l.reason || "").replace(/^[^:]{0,40}:\s*/, "").slice(0, 140))}</small>` });
  if (S.layers.crime && typeof crimeInfo !== "undefined" && crimeInfo)
    out.push({ cls: "info", html: `🚓 Street crime shown is from ${monthName(crimeInfo.month)}<small>The local force hasn't published ${monthName(crimeInfo.latest)} figures to police.uk</small>` });
  const sewNow = lastSewage.filter(o => o.active);
  if (sewNow.length) {
    const by = Object.entries(sewNow.reduce((m, o) => (m[o.company] = (m[o.company] || 0) + 1, m), {})).sort((x, y) => y[1] - x[1]);
    out.push({ cls: "info", html: `🟤 ${sewNow.length} sewage overflow${sewNow.length > 1 ? "s" : ""} discharging now<small>${by.map(([c, n]) => `${esc(c)} ${n}`).join(" · ")}</small>` });
  }
  const urgent = out.filter(o => o.cls === "" || o.cls === "amber").length;
  $("btnInfo").textContent = urgent ? `Info ⚠ ${urgent}` : "Info";
  $("btnInfo").classList.toggle("alerting", urgent > 0);
  $("alerts").innerHTML = out.length
    ? out.map(o => `<div class="alert ${o.cls}" ${o.ll ? `data-ll="${o.ll}"` : ""}>${o.html}</div>`).join("")
    : '<div class="muted">All quiet ✓</div>';
}

/* ------------------------------------------------------------ energy: regions, generation, EV chargers */
const CI_COL = { "very low": "#16a34a", low: "#84cc16", moderate: "#facc15", high: "#f97316", "very high": "#dc2626" };
const agileCol = (p) => p == null ? "#64748b" : p < 0 ? "#38bdf8" : p < 10 ? "#16a34a" : p < 17 ? "#84cc16" : p < 24 ? "#facc15" : p < 30 ? "#f97316" : "#dc2626";
const solarCol = (f) => f <= 0.005 ? "#334155" : `hsl(${45 + 10 * (1 - f)}, ${60 + 35 * f}%, ${28 + 30 * f}%)`;
const REGION_MODES = { carbon: "Carbon", solar: "Solar", agile: "Agile" };
let regionShapes = [], regionLive = {};
map.createPane("regions").style.zIndex = 350;  // under markers and routes
const regionRenderer = L.canvas({ pane: "regions" });
const RegionCtl = L.Control.extend({
  options: { position: "bottomright" },
  onAdd() {
    const d = L.DomUtil.create("div", "radar-ctl");
    L.DomEvent.disableClickPropagation(d);
    d.onclick = (e) => { const m = e.target.dataset.mode; if (m) { S.regionMode = m; save(); renderRegions(); } };
    return d;
  },
});
const regionCtl = new RegionCtl();
function regionFill(l) {
  const m = S.regionMode;
  if (m === "solar") return l?.solar?.cap ? [solarCol(l.solar.mw / l.solar.cap), l.solar.mw ? `${(l.solar.mw / 1000).toFixed(1)} GW ☀️` : "dark"] : ["#334155", "–"];
  if (m === "agile") return l?.agile ? [agileCol(l.agile.now), `${l.agile.now.toFixed(1)}p`] : ["#334155", "–"];
  return l?.carbon ? [CI_COL[l.carbon.index] || "#64748b", `${l.carbon.g} g`] : ["#334155", "–"];
}
function agileSpark(rates) {
  if (!rates?.length) return "";
  const hi = Math.max(35, ...rates.map(r => r[1])), lo = Math.min(0, ...rates.map(r => r[1]));
  return `<div class="spark" title="Next ${rates.length / 2} hours, half-hourly">${rates.map(([t, p]) =>
    `<i style="height:${Math.max(2, (p - lo) / (hi - lo) * 100)}%;background:${agileCol(p)}" title="${ukTime(t)} ${p}p"></i>`).join("")}</div>
    <span class="muted" style="font-size:11px">${ukTime(rates[0][0])} → ${ukDay(rates.at(-1)[0])} ${ukTime(rates.at(-1)[0])}</span>`;
}
function regionPopup(r) {
  const l = regionLive[r.pes] || {}, c = l.carbon, so = l.solar, a = l.agile;
  return `<b>${esc(r.name)}</b> <span class="muted">${esc(r.dno)}</span>
    ${c ? `<br>🌱 Carbon <b style="color:${CI_COL[c.index]}">${c.g} g/kWh</b> (${esc(c.index)})<br><span class="muted" style="font-size:11px">${c.mix.map(([f, p]) => `${esc(f)} ${p}%`).join(" · ")}</span>` : ""}
    ${so ? `<br>☀️ Solar <b>${so.mw.toLocaleString()} MW</b> of ${so.cap.toLocaleString()} MW installed (${so.cap ? Math.round(so.mw / so.cap * 100) : 0}%)` : ""}
    ${a ? `<br>⚡ Octopus Agile <b style="color:${agileCol(a.now)}">${a.now.toFixed(2)}p/kWh</b> now (region ${esc(r.letter)}, inc VAT)${agileSpark(a.rates)}` : ""}
    <br><span class="muted" style="font-size:11px">NESO Carbon Intensity · Sheffield Solar PV_Live · Octopus Energy</span>`;
}
function renderRegions() {
  G.grid_regions.clearLayers();
  if (!S.layers.grid_regions) { regionCtl.remove(); return; }
  regionCtl.addTo(map);
  regionCtl.getContainer().innerHTML = Object.entries(REGION_MODES).map(([k, n]) => `<button data-mode="${k}" class="${S.regionMode === k ? "on" : ""}">${n}</button>`).join(" ");
  for (const r of regionShapes) {
    const [col, label] = regionFill(regionLive[r.pes]);
    L.polygon(r.shapes, { renderer: regionRenderer, interactive: false, color: col, weight: 1, opacity: .8, fillColor: col, fillOpacity: .28 })

async function loadAreas() {  // the drop-down: regions and nations, then each one's counties with their districts indented
  if (areaList) return;

  try { areaList = (await (await fetch(withToken(API + "areas"))).json()).areas || []; } catch { areaList = null; return; }
  const opt = (a, pad = "") => `<option value="${esc(a.id)}">${pad}${esc(a.name)}</option>`;
  const by = (k) => (a, b) => a[k].localeCompare(b[k]);
  const top = areaList.filter((a) => a.kind === "Nation" || a.kind === "Region").sort((a, b) => (a.kind > b.kind) - (a.kind < b.kind) || a.name.localeCompare(b.name));
  const groups = [...new Set(areaList.filter((a) => a.group && a.kind !== "National park").map((a) => a.group))]
    .sort((a, b) => (["Wales", "Scotland", "Northern Ireland"].indexOf(a) - ["Wales", "Scotland", "Northern Ireland"].indexOf(b)) || a.localeCompare(b));
  let html = `<option value="">…or choose a county, region or national park</option><optgroup label="Nations and English regions">${top.map((a) => opt(a)).join("")}</optgroup>`;
  for (const g of groups) {
    const inG = areaList.filter((a) => a.group === g && a.kind !== "National park");
    const rows = inG.filter((a) => a.kind !== "District").sort(by("name")).map((a) => opt(a) +
      inG.filter((d) => d.kind === "District" && d.parent === a.name).sort(by("name")).map((d) => opt(d, "\u00a0\u00a0\u00a0– ")).join(""));

  const seq = ++areaSeq;
  let d;
  try { d = await (await fetch(withToken(API + "area?id=" + encodeURIComponent(r.id)))).json(); } catch { return; }
  if (seq !== areaSeq || !d.shapes) return;
  if (areaShape) areaShape.remove();
  areaShape = L.polygon(d.shapes, { color: "#f43f5e", weight: 2.5, dashArray: "6 5", fillColor: "#f43f5e", fillOpacity: 0.06, interactive: false })
    .bindTooltip(`<span class="area-lbl">${esc(d.name)}</span> <span class="muted">${esc(d.kind)}</span>`, { permanent: true, direction: "center", className: "region-lbl" })
    .addTo(map);
}
function goTo(r) {
  if (r.id && r.bbox) return goToArea(r);
  clearFound();
  searchPin = L.marker([r.lat, r.lon], { icon: L.divIcon({ className: "", html: '<div class="found-pin"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }), zIndexOffset: 2000 })
    .bindTooltip(esc(r.name) + (r.area ? ` <span class="muted">${esc(r.area)}</span>` : ""), { permanent: true, direction: "top", offset: [0, -12] })
    .addTo(map);
  map.flyTo([r.lat, r.lon], r.zoom || 13, { duration: 1.2 });
  searchHits = []; $("searchRes").innerHTML = ""; openSearch(false);
}
function showHits(hits, msg) {
  searchHits = hits; searchSel = 0;
  $("searchRes").innerHTML = hits.length ? hits.map((r, i) => `<div class="r${i ? "" : " sel"}" data-i="${i}"><span><b>${esc(r.name)}</b>${r.alt ? ` <span class="muted">(${esc(r.alt)})</span>` : ""}</span>
    <span class="muted">${esc(r.kind)}${r.area ? ` · ${esc(r.area)}` : ""}</span></div>`).join("") : msg ? `<div class="msg">${esc(msg)}</div>` : "";
}
async function runSearch(q, go) {
  q = q.trim();
  const ll = q.match(/^(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);  // "51.5, -0.12"
  if (ll) { const r = { name: q, lat: +ll[1], lon: +ll[2], zoom: 14, kind: "Coordinates" }; return go ? goTo(r) : showHits([r]); }
  if (q.length < 2) return showHits([]);
  const seq = ++searchSeq;
  let d;
  try { d = await (await fetch(withToken(API + "search?q=" + encodeURIComponent(q)))).json(); }
  catch { d = { results: [], error: "Search unavailable" }; }
  if (seq !== searchSeq) return;  // a newer search has started
  const hits = d.results || [];
  if (go && hits.length) return goTo(hits[searchSel] || hits[0]);
  showHits(hits, d.error || (hits.length ? "" : "No match in the UK"));
}
$("btnSearch").onclick = () => openSearch(!$("searchBox").classList.contains("open"));
$("searchClear").onclick = () => { clearFound(); areaSeq++; $("searchQ").value = ""; $("searchArea").value = ""; showHits([]); openSearch(false); };
$("searchArea").addEventListener("change", (e) => {
  const a = (areaList || []).find((x) => x.id === e.target.value);
  if (a) { $("searchQ").value = a.name; goTo({ ...a, lat: (a.bbox[0] + a.bbox[2]) / 2, lon: (a.bbox[1] + a.bbox[3]) / 2 }); }
});
$("searchQ").addEventListener("input", (e) => { clearTimeout(searchTimer); searchHits = []; const q = e.target.value; searchTimer = setTimeout(() => runSearch(q, false), 350); });
$("searchQ").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { openSearch(false); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!searchHits.length) return;
    searchSel = (searchSel + (e.key === "ArrowDown" ? 1 : searchHits.length - 1)) % searchHits.length;
    document.querySelectorAll("#searchRes .r").forEach((el, i) => el.classList.toggle("sel", i === searchSel));
  }
  if (e.key === "Enter") { e.preventDefault(); clearTimeout(searchTimer); searchHits.length ? goTo(searchHits[searchSel]) : runSearch(e.target.value, true); }
});
$("searchRes").addEventListener("click", (e) => { const el = e.target.closest(".r"); if (el) goTo(searchHits[+el.dataset.i]); });
$("btnPanels").onclick = () => document.body.classList.toggle("hide-panels");
$("btnFs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.key === "/" || e.key === "s" || e.key === "S") { e.preventDefault(); openSearch(true); return; }
  if (e.key === "p" || e.key === "P") $("btnPanels").click();
  if (e.key === "f" || e.key === "F") $("btnFs").click();
  if (e.key === "h" || e.key === "H") goHome();
  if (e.key === "l" || e.key === "L") locate();
  if (e.key === "u" || e.key === "U") map.flyTo(...UK_VIEW(), { duration: 1 });
});
start();
</script>
</body>
